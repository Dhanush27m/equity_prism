# Component: Backend -> Data Layer -> Alembic CLI configuration
# Belongs to: read by the `alembic` command-line tool (upgrade/downgrade/revision).
# Purpose: points Alembic at the alembic/ script directory and sets logging verbosity;
# the actual database URL is NOT read from here — alembic/env.py overrides it at
# runtime from the app's own DATABASE_URL_SYNC setting, so this file only needs to
# exist to satisfy Alembic's CLI, not to carry real connection info.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
