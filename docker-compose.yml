services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: equityprism
      POSTGRES_PASSWORD: a315ad5ba872666a6f04c209e7a61699
      POSTGRES_DB: equity_prism
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equityprism -d equity_prism"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: equity-prism-backend:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://equityprism:a315ad5ba872666a6f04c209e7a61699@db:5432/equity_prism
      DATABASE_URL_SYNC: postgresql+psycopg://equityprism:a315ad5ba872666a6f04c209e7a61699@db:5432/equity_prism
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
      CACHE_BACKEND: memory
      INGEST_MODE: background
      EMBEDDING_BACKEND: local
      RERANK_ENABLED: "true"
      RUN_MIGRATIONS: "1"
    volumes:
      - ./backend:/app
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: ["sh", "start.sh"]

volumes:
  pgdata:
  ollama_data:
  uploads:
